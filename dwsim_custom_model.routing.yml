    id: \d+

dwsim_custom_model.manage_proposal.status:
  path: '/custom-model/manage-proposal/status/{id}'
  defaults:
    _title: 'Proposal Status'
    _form: '\Drupal\dwsim_custom_model\Form\ProposalStatusForm'
  requirements:
    _permission: 'custom model approve proposal'
    id: \d+

dwsim_custom_model.manage_proposal.view_ideas:
  path: '/custom-model/manage-proposal/view-ideas/{id}'
  defaults:
    _title: 'View Idea Proposal'
    _form: '\Drupal\dwsim_custom_model\Form\ViewIdeaProposalForm'
  requirements:
