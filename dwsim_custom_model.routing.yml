  defaults:
    _title: 'Approve Proposal'
    _form: '\Drupal\dwsim_custom_model\Form\ProposalApprovalForm'
  requirements:
    _permission: 'custom model manage proposal'
    id: \d+

dwsim_custom_model.manage_proposal.edit:
  path: '/custom-model/manage-proposal/edit/{id}'
  defaults:
    _title: 'Edit Proposal'
