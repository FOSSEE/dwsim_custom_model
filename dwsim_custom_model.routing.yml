# Routing skeleton extracted from hook_menu() in custom_model.module.
#
# In Drupal 11, hook_menu() is replaced by this file plus Controller classes.
# These routes are STUBS only — _controller entries are placeholders.
# Do NOT activate this file until Controllers are implemented.
#
# Current workflow: submit proposal → manage proposal → code submission →
#                   bulk approval → mark completed
#
# Migration note:
# Each 'page callback' in hook_menu() maps to a Controller method here.
# 'access arguments' map to '_permission' checks.
# MENU_LOCAL_TASK maps to route tabs via dwsim_custom_model.links.task.yml.

# --- PROPOSAL ---

dwsim_custom_model.proposal:
  path: '/custom-model/proposal'
  defaults:
    _title: 'Custom Model Proposal Form'
    _controller: '\Drupal\dwsim_custom_model\Controller\ProposalController::form'
  requirements:
    _permission: 'custom model create proposal'

dwsim_custom_model.idea_proposal:
  path: '/custom-model/idea-proposal'
  defaults:
    _title: 'Custom Model Idea Proposal Form'
    _controller: '\Drupal\dwsim_custom_model\Controller\ProposalController::ideaForm'
  requirements:
    _permission: 'custom model create idea proposal'

