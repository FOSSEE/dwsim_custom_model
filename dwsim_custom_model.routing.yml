  defaults:
    _title: 'Idea Proposals'
    _controller: '\Drupal\dwsim_custom_model\Controller\DefaultController::ideaAll'
  requirements:
    _permission: 'custom model manage proposal'

dwsim_custom_model.manage_proposal.approved:
  path: '/custom-model/manage-proposal/approved-proposals'
  defaults:
    _title: 'Approved Proposals'
    _controller: '\Drupal\dwsim_custom_model\Controller\DefaultController::approved'
  requirements:
    _permission: 'custom model manage proposal'

dwsim_custom_model.manage_proposal.uploaded:
