# Routing for dwsim_custom_model — extracted from hook_menu() in custom_model.module.
#
# All _controller entries point to DefaultController, which holds all page
# callbacks in one file (matching the team's existing FreeCad module convention).
#
# Workflow: submit proposal → manage proposal → code submission →
#           bulk approval → mark completed
#
# Migration note:
#   'page callback' in hook_menu()  → _controller method in DefaultController
#   'access arguments'              → _permission
#   MENU_LOCAL_TASK                 → dwsim_custom_model.links.task.yml
#   arg(N) in D7                    → {param} route parameter in D11

# --- PROPOSAL ---

dwsim_custom_model.proposal:
  path: '/custom-model/proposal'
  defaults:
    _title: 'Custom Model Proposal Form'
    _form: '\Drupal\dwsim_custom_model\Form\ProposalForm'
  requirements:
    _permission: 'custom model create proposal'

dwsim_custom_model.idea_proposal:
  path: '/custom-model/idea-proposal'
  defaults:
    _title: 'Custom Model Idea Proposal Form'
    _form: '\Drupal\dwsim_custom_model\Form\IdeaProposalForm'
  requirements:
    _permission: 'custom model create idea proposal'

# --- MANAGE PROPOSAL ---

dwsim_custom_model.manage_proposal:
  path: '/custom-model/manage-proposal'
  defaults:
    _title: 'Manage Custom Model Proposals'
    _controller: '\Drupal\dwsim_custom_model\Controller\DefaultController::pending'
  requirements:
    _permission: 'custom model manage proposal'

dwsim_custom_model.manage_proposal.pending:
  path: '/custom-model/manage-proposal/pending'
  defaults:
    _title: 'Pending Proposals'
    _controller: '\Drupal\dwsim_custom_model\Controller\DefaultController::pending'
  requirements:
    _permission: 'custom model manage proposal'

dwsim_custom_model.manage_proposal.all:
  path: '/custom-model/manage-proposal/all'
  defaults:
    _title: 'All Proposals'
    _controller: '\Drupal\dwsim_custom_model\Controller\DefaultController::all'
